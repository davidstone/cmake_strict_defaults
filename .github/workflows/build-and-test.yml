name: Build and test

on:
  schedule:
    - cron: '27 10 * * *'
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:
    inputs:
      event_name:
        description: 'github.event_name from the calling workflow, used to select the build matrix'
        type: string
        default: ''
      dependencies:
        description: 'List of extra dependencies to install'
        type: string
        default: ''
      cmake_args:
        description: 'List of extra CMake arguments'
        type: string
        default: ''

jobs:
  compute-matrix:
    uses: davidstone/cmake_strict_defaults/.github/workflows/compute-matrix.yml@main
    with:
      event_name: ${{inputs.event_name != '' && inputs.event_name || github.event_name}}

  build:
    needs: compute-matrix
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.compute-matrix.outputs.matrix)}}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
    - uses: ./
        with:
          clang_version: ${{matrix.clang_version}}
          dependencies: ${{inputs.dependencies}}
          cmake_args: ${{inputs.cmake_args}}